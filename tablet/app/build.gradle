plugins {
    id 'com.android.application'
}

android {
    namespace 'com.animeshelf.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.animeshelf.app'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '0.1.13.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'anime.visuals.dir', project.layout.buildDirectory.dir('reports/visuals').get().asFile.absolutePath
            testLogging {
                events 'failed'
                exceptionFormat 'full'
            }
        }
    }

    signingConfigs {
        debug {
            def ciKeystore = System.getenv('ANIME_DEBUG_KEYSTORE')
            if (ciKeystore != null && !ciKeystore.trim().isEmpty()) {
                storeFile file(ciKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-database:1.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
