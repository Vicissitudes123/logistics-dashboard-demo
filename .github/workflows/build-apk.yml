name: Build Android test APK

on:
  workflow_dispatch:
  push:
    branches:
      - anime-shelf-apk
    paths-ignore:
      - 'downloads/**'
      - '.github/workflows/deliver-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANIME_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preserve test APK signing identity
        uses: actions/cache@v4
        with:
          path: ${{ env.ANIME_DEBUG_KEYSTORE }}
          key: anime-shelf-debug-signing-v2
      - name: Create test signing key when absent
        shell: bash
        run: |
          if [ ! -s "$ANIME_DEBUG_KEYSTORE" ]; then
            mkdir -p "$(dirname "$ANIME_DEBUG_KEYSTORE")"
            keytool -genkeypair -keystore "$ANIME_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check media parser
        run: |
          mkdir -p build/parser-test
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o build/parser-test/json.jar
          javac --release 17 -cp build/parser-test/json.jar -d build/parser-test app/src/main/java/com/animeshelf/app/Models.java app/src/main/java/com/animeshelf/app/BiliClient.java tests/ParserSelfTest.java
          java -cp build/parser-test:build/parser-test/json.jar com.animeshelf.app.ParserSelfTest
      - name: Test, build and lint
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon
      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/apk-info.txt
      - name: Upload APK and validation reports
        uses: actions/upload-artifact@v4
        with:
          name: anime-shelf-test-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/apk-info.txt
            app/build/outputs/apk/debug/apk-signature.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
