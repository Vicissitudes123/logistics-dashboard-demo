name: Build Android test APK

on:
  workflow_dispatch:
  push:
    branches:
      - anime-shelf-apk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preserve test APK signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: anime-shelf-debug-signing-v1
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check media parser
        run: |
          mkdir -p build/parser-test
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o build/parser-test/json.jar
          javac --release 17 -cp build/parser-test/json.jar -d build/parser-test app/src/main/java/com/animeshelf/app/Models.java app/src/main/java/com/animeshelf/app/BiliClient.java tests/ParserSelfTest.java
          java -cp build/parser-test:build/parser-test/json.jar com.animeshelf.app.ParserSelfTest
      - name: Build and lint
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/apk-info.txt
      - name: Upload APK and lint report
        uses: actions/upload-artifact@v4
        with:
          name: anime-shelf-test-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/apk-info.txt
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
