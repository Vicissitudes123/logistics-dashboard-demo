name: Temporary ASR Bootstrap

on:
  push:
    paths:
      - '.github/workflows/tmp-asr-bootstrap.yml'
  workflow_dispatch:

jobs:
  build-asr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build whisper.cpp static CLI
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF
          cmake --build /tmp/whisper.cpp/build --config Release -j2
          mkdir -p asr_bundle
          cp /tmp/whisper.cpp/build/bin/whisper-cli asr_bundle/whisper-cli
          chmod +x asr_bundle/whisper-cli

      - name: Download multilingual tiny model
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o asr_bundle/ggml-tiny-q5_1.bin \
            https://raw.githubusercontent.com/TranscribeJs/transcribe.js/main/examples/models/ggml-tiny-q5_1.bin
          sha256sum asr_bundle/ggml-tiny-q5_1.bin | tee asr_bundle/SHA256SUMS.txt

      - name: Upload local ASR bundle
        uses: actions/upload-artifact@v4
        with:
          name: local-asr-bundle
          path: asr_bundle/
          if-no-files-found: error
          retention-days: 1
