name: Temporary Whisper Model Download

on:
  push:
    branches:
      - tmp-whisper-model-20260816

permissions:
  contents: read

jobs:
  download-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper small quantized model
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 10 --retry-all-errors \
            -o ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          ls -lh ggml-small-q5_1.bin
          sha256sum ggml-small-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-small-q5_1-model
          path: ggml-small-q5_1.bin
          retention-days: 1
