name: Temporary Local ASR Bundle 20260824

on:
  push:
    branches:
      - tmp-asr-local-20260824
    paths:
      - '.github/workflows/tmp-asr-local-20260824.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp-asr-local-20260824

      - name: Build whisper.cpp with runtime libraries
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=OFF
          cmake --build /tmp/whisper.cpp/build --config Release -j2
          mkdir -p bundle
          cp /tmp/whisper.cpp/build/bin/whisper-cli bundle/whisper-cli
          chmod +x bundle/whisper-cli
          find /tmp/whisper.cpp/build \( -type f -o -type l \) -name '*.so*' -exec cp -a {} bundle/ \;
          echo 'Bundled runtime:'
          ls -lh bundle
          echo 'Dynamic dependencies:'
          LD_LIBRARY_PATH="$PWD/bundle" ldd bundle/whisper-cli || true

      - name: Download multilingual Whisper small q5 model
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 10 --retry-all-errors \
            -o bundle/ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          ls -lh bundle/ggml-small-q5_1.bin
          sha256sum bundle/ggml-small-q5_1.bin

      - name: Upload bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: local-asr-small-q5-runtime
          path: bundle/
          retention-days: 1

      - name: Publish run identifiers to temporary branch
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          printf '{"run_id":%s,"artifact_id":%s,"commit":"%s"}\n' "$RUN_ID" "$ARTIFACT_ID" "$GITHUB_SHA" > .tmp-asr-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-asr-run.json
          git commit -m 'chore: publish temporary ASR runtime artifact id'
          git push origin HEAD:tmp-asr-local-20260824
